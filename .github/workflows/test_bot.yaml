name: Test Bot (offline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline_test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test safety guards without keys, network, or package installs
        run: python -m unittest discover -s tests -v

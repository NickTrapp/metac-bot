name: Research loop offline checks

on:
  push:
    branches: [research-loop-starter]
  pull_request:
    paths:
      - 'research_loop*.py'
      - 'research-loop-*.json'
      - 'tests/*research_loop*'
      - '.github/workflows/research_loop*.yaml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install openai==2.13.0
      - run: python tests/check_research_loop_sdk_offline.py
      - run: python research_loop.py
